services:
  postgres:
    image: postgres:16-alpine
    container_name: cric-stats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cricket}
      POSTGRES_USER: ${POSTGRES_USER:-cricket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cricket} -d ${POSTGRES_DB:-cricket}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cric-stats-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cricket}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cricket}
    ports:
      - "3000:3000"

volumes:
  pgdata:
